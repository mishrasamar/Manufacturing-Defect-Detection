# ---------------------------------------------------------------------------
# Manufacturing Defect Detection - configuration
# Every detection / severity / status threshold used by the pipeline is
# defined here. Values can be overridden interactively from the Streamlit
# sidebar; code never hardcodes thresholds.
# ---------------------------------------------------------------------------

processing:
  max_display_width: 800        # images wider than this are scaled down (aspect preserved)
  denoise_method: median        # "median" or "gaussian"
  denoise_ksize: 5              # must be odd
  normalize: false              # percentile contrast stretch (amplifies noise; off by default)
  normalize_percentiles: [1, 99]
  use_clahe: false              # optional CLAHE contrast enhancement
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8

detection:
  max_regions_per_image: 200    # safety cap: keep the strongest regions only
  dedupe_iou: 0.6               # regions overlapping more than this IoU are merged
  min_background_std: 2.0       # skip blob detectors when the image is statistically flat

  spot:                         # spots / stains: deviation from a median background
    enabled: true
    background_blur_ksize: 31
    min_contrast: 18            # minimum mean |pixel - background| inside a region
    min_area: 20                # pixels
    max_area: 3000              # pixels
    min_circularity: 0.25       # 4*pi*Area / Perimeter^2
    min_solidity: 0.5           # Area / ConvexHullArea

  scratch:                      # thin elongated marks from Canny edges
    enabled: true
    canny_low: 45
    canny_high: 140
    connect_kernel: 15          # 1xN / Nx1 closing kernel that joins edge segments
    min_aspect_ratio: 5.0       # length / thickness (min-area rectangle)
    max_thickness: 9            # pixels
    min_length: 40              # pixels
    min_area: 40                # pixels

  crack:                        # jagged / branching edge structures
    enabled: true
    canny_low: 40
    canny_high: 130
    dilate_ksize: 3
    min_aspect_ratio: 3.0
    max_solidity: 0.65          # jagged shapes fill their convex hull poorly
    min_area: 60

  dent:                         # broad irregular surface deviations
    enabled: true
    min_contrast: 12            # minimum |pixel - global surface level|
    min_area_ratio: 0.004       # fraction of image area
    max_circularity: 0.65       # dents are irregular, spots are round
    max_solidity: 0.92

  discoloration:                # colour deviation from the image median (HSV)
    enabled: true
    min_area: 150
    saturation_offset: 30       # |S - median(S)| threshold
    hue_offset: 18              # circular hue distance threshold
    min_abs_saturation: 45      # region mean saturation must exceed this

  reference:                    # optional comparison against a reference image
    enabled: true
    min_area: 60
    blur_ksize: 5
    min_contrast: 25

severity:
  major_area_ratio: 0.01        # defect area >= 1% of image area -> Major
  critical_area_ratio: 0.05     # defect area >= 5% of image area -> Critical
  category_floor:               # minimum severity for specific categories
    Crack: Major
  fail_total_area_ratio: 0.08   # cumulative defect area that fails an image
  fail_defect_count: 8          # defect region count that fails an image
  review_total_area_ratio: 0.015
  review_defect_count: 3

ml:
  enabled: false                # optional ONNX classifier hook (see README section 7)
  model_path: ""
  input_size: [224, 224]
  scale: 0.00392                # 1/255
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]
  swap_rb: true
  class_names: []

report:
  max_table_rows: 25            # inspection table rows in the PDF report
  max_image_examples: 4         # original/annotated example pairs in the PDF report

output:
  root: outputs                 # each batch gets its own timestamped sub-folder
